name: Backend CI Pipeline

on:
  push:
    branches: [develop, main]
    paths:
      - 'yaga-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'yaga-backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format Check (Spotless)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yaga-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - run: ./mvnw spotless:check

  unit-test:
    name: Unit Tests (Surefire)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yaga-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - run: ./mvnw test

  coverage:
    name: Code Coverage (JaCoCo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yaga-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - run: ./mvnw test jacoco:report

  integration-test:
    name: Integration Tests (Failsafe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yaga-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - run: ./mvnw verify -DskipUnitTests

  build:
    name: Package Build (Quarkus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yaga-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - run: ./mvnw package -DskipTests
